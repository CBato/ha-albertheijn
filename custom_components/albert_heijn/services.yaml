search_products:
  name: Search Products
  description: Search for products in the Albert Heijn webshop.
  fields:
    query:
      name: Query
      description: The search term to find products.
      required: true
      example: "melk"
      selector:
        text:
    limit:
      name: Limit
      description: Maximum number of results to return.
      required: false
      default: 10
      example: 10
      selector:
        number:
          min: 1
          max: 30

add_to_order:
  name: Add to Order
  description: >-
    Put products in the next order that can still be changed. A submitted order is reopened first;
    confirm the change in the AH app afterwards.
  fields:
    product_id:
      name: Product ID
      description: The webshop product ID to add (or use products for several at once).
      required: false
      example: 553353
      selector:
        number:
          min: 1
          mode: box
    quantity:
      name: Quantity
      description: Number of items to add (0 to remove).
      required: false
      default: 1
      example: 2
      selector:
        number:
          min: 0
          max: 99
    products:
      name: Products
      description: "Several products at once, e.g. [{product_id: 54074, quantity: 2}]."
      required: false
      example: "[{product_id: 54074, quantity: 2}]"
      selector:
        object:
    order_id:
      name: Order ID
      description: Order to change; default the active order, else the next one that can be changed.
      required: false
      selector:
        number:
          min: 1
          mode: box

reopen_order:
  name: Reopen Order
  description: Reopen a submitted order to allow adding or removing items.
  fields:
    order_id:
      name: Order ID
      description: The order ID to reopen.
      required: true
      example: 316501042
      selector:
        number:
          min: 1
          mode: box

remove_from_order:
  name: Remove from Order
  description: Remove a product from the current active order by product ID.
  fields:
    product_id:
      name: Product ID
      description: The webshop product ID to remove.
      required: true
      example: 553353
      selector:
        number:
          min: 1
          mode: box

revert_order:
  name: Revert Order
  description: Revert a reopened order back to its submitted state.
  fields:
    order_id:
      name: Order ID
      description: The order ID to revert.
      required: true
      example: 316501042
      selector:
        number:
          min: 1
          mode: box

lookup_barcode:
  name: Look up barcode
  description: Find the AH product for a barcode (EAN-13, EAN-8, UPC-A). Returns an empty list if AH doesn't sell it.
  fields:
    barcode:
      name: Barcode
      description: The digits under the barcode.
      required: true
      example: "8710400000000"
      selector:
        text:

get_frequent_items:
  name: Get frequently ordered products
  description: >-
    Products from the stored order history, most often (and recently) ordered first,
    followed by the rest of AH's "Eerder gekocht" list.
  fields:
    limit:
      name: Limit
      description: Maximum number of products.
      required: false
      default: 100
      selector:
        number:
          min: 1
          max: 1000
          mode: box
    include_catalog:
      name: Include "Eerder gekocht"
      description: Also return products that were never delivered but are in AH's "Eerder gekocht".
      required: false
      default: true
      selector:
        boolean:

sync_history:
  name: Sync order history
  description: Fetch new delivered orders now (normally once a day and after each delivery).
  fields:
    refresh_catalog:
      name: Refresh "Eerder gekocht"
      description: Also fetch AH's "Eerder gekocht" list again.
      required: false
      default: false
      selector:
        boolean:

get_price_history:
  name: Get price history
  description: Weekly prices (price, price without bonus, bonus) and the prices paid in delivered orders for one product.
  fields:
    product_id:
      name: Product ID
      description: The webshop product ID.
      required: true
      example: 54074
      selector:
        number:
          min: 1
          mode: box

fill_list:
  name: Fill the shopping list
  description: >-
    Put this week's suggestions on the AH shopping list (in the AH app also the basket): products that are due
    according to the order rhythm, and regularly bought products that are in a real bonus. Skips what is already
    on the list, in the order, or was suggested before this week. The reasons are kept (sensor "Voorstellen").
  fields:
    dry_run:
      name: Dry run
      description: Only return the suggestions, don't change the list.
      default: false
      selector:
        boolean:
    min_count:
      name: Minimum orders
      description: A product must have been ordered at least this many times.
      default: 3
      selector:
        number:
          min: 1
          max: 50
    min_share:
      name: Minimum share
      description: Part of the orders (since it was first ordered) a product must have been in, 0 to 1.
      default: 0.3
      selector:
        number:
          min: 0
          max: 1
          step: 0.05
    max_items:
      name: Maximum products
      default: 25
      selector:
        number:
          min: 1
          max: 100

graphql_query:
  name: GraphQL query (explore)
  description: Run a read-only GraphQL query against the AH API, to explore what it offers. Mutations are refused.
  fields:
    query:
      name: Query
      required: true
      example: "query { __type(name: \"OrderFulfillmentStatus\") { enumValues { name } } }"
      selector:
        text:
          multiline: true
    variables:
      name: Variables
      required: false
      selector:
        object:

get_product_history:
  name: Get product history
  description: One product - details, every purchase (delivery and store receipt) with price per item, weekly prices, rhythm and totals.
  fields:
    product_id:
      name: Product ID
      required: true
      example: 377719
      selector:
        number:
          min: 1
          mode: box

get_insights:
  name: Get insights
  description: Spending this month and last month, per week (delivery / store), biggest items and categories (90 days), bonus savings and price movers.
  fields:
    weeks:
      name: Weeks
      description: How many weeks in the per-week overview.
      default: 12
      selector:
        number:
          min: 4
          max: 52

get_products:
  name: Get products overview
  description: >-
    Every product ever bought (delivery and store) - last bought, times, average paid per item (what was really paid),
    current price and bonus from the weekly check, and the difference between the current normal price and the average paid.

get_bonus:
  name: Get bonus
  description: >-
    Bonus of this week or next week (published a few days ahead) on products you bought before and your personal bonus,
    with per product the price per item with the offer and the deal against what you paid on average.
  fields:
    week:
      name: Week
      default: current
      selector:
        select:
          options:
            - current
            - next

snooze_product:
  name: Snooze product
  description: Don't suggest a product (in fill_list and as "due") for a number of days; -1 = never again, 0 = suggest again.
  fields:
    product_id:
      name: Product ID
      required: true
      selector:
        number:
          min: 1
          mode: box
    days:
      name: Days
      default: 7
      selector:
        number:
          min: -1
          max: 365
          mode: box

cleanup_suggestions:
  name: Clean up old suggestions
  description: >-
    Remove automatically added suggestions that were left on the list for a number of days: only when still on the
    list with exactly the suggested quantity, not ticked, not in the order and not bought since.
  fields:
    days:
      name: Days
      default: 14
      selector:
        number:
          min: 1
          max: 90
    dry_run:
      name: Dry run
      default: false
      selector:
        boolean:
